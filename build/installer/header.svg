<svg xmlns="http://www.w3.org/2000/svg" width="150" height="57" viewBox="0 0 150 57">
  <!-- The installer's page header picture (installerHeader.bmp, 150 × 57, right-aligned).
       Rendered by `npm run icons`; LOGO is replaced with public/moon-explorer-logo.svg. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#2a2060" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2060"/>
      <stop offset="1" stop-color="#0b0920"/>
    </linearGradient>
  </defs>
  <rect width="150" height="57" fill="url(#night)"/>
  <rect width="150" height="57" fill="url(#sky)"/>
  <g fill="#f4f1ff">
    <circle cx="66" cy="12" r="0.9" opacity="0.8"/>
    <circle cx="82" cy="40" r="0.8" opacity="0.6"/>
    <circle cx="140" cy="10" r="1" opacity="0.9"/>
    <circle cx="144" cy="46" r="0.8" opacity="0.6"/>
  </g>
  <circle cx="74" cy="26" r="0.9" fill="#9ad7f5" opacity="0.7"/>
  <image href="LOGO" x="93" y="7" width="43" height="43"/>
</svg>
